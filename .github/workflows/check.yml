name: Local prototype and contribution checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.3
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q
      - run: uv run python contribution_check.py --reproduce
      - name: Prepare and verify exactly the checked commit
        run: |
          uv run python tools/check_snapshot.py prepare --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/crl-snapshot" > "$RUNNER_TEMP/crl-snapshot-result.json"
          uv run python tools/check_snapshot.py verify --archive "$RUNNER_TEMP/crl-snapshot/$GITHUB_SHA.tar" --manifest "$RUNNER_TEMP/crl-snapshot/$GITHUB_SHA.manifest.json"
